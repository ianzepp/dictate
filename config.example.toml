# Local dictation config. The speech service and the menu-bar app both read this file.
# Edit replacements while the service is running; they apply on the next utterance.
# Endpoints, models, and the hotkey apply on restart.

[stt]
base_url = "http://127.0.0.1:8090"
model = "~/.local/share/dictate/models/mlx-community--whisper-large-v3-turbo-4bit"
language = "en"

[llm]
base_url = "http://127.0.0.1:8091/v1"
model = "qwen2.5-1.5b-instruct"
# Empty for the bundled llama-server, which is started with reasoning off.
# Set "none" if base_url points at a reasoning model that should skip thinking.
reasoning_effort = ""

[hotkey]
# Fn needs System Settings > Keyboard > "Press 🌐 key to" set to Do Nothing.
# Names: fn, right_option, left_option, right_command, left_command, right_control, right_shift
key = "fn"
mode = "hold"

[debug]
# Writes each step under ~/Library/Logs/Dictate/debug/<timestamp>/.
enabled = false

[replacements]
# "heard phrase" = "Canonical Form"
